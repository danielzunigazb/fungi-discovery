name: Bug report
description: Reporta un fallo reproducible de software o pipeline.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "No publiques API keys, correos personales, datos privados ni ubicaciones sensibles."
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: "v0.1.0 / abc1234"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando reproducible
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado obtenido
    validations:
      required: true
  - type: textarea
    id: minimal-input
    attributes:
      label: Input mínimo sintético
      description: "No adjuntes datos restringidos o metadatos sensibles."
  - type: textarea
    id: scientific-impact
    attributes:
      label: Posible impacto científico
      description: "Indica si el fallo cambia filtrado, cobertura, taxonomía o prioridades."
